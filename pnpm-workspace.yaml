packages:
  - applications/**
  - packages/**
  - models
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  bcrypt: true
  core-js: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - expo-modules-autolinking@56.0.14
  - expo@56.0.6
  - expo-router@6.0.24
  - expo-server@1.0.7
  - '@expo/cli@54.0.25'
  - '@expo/json-file@10.0.16'
  - '@expo/metro-config@54.0.16'
  - '@expo/plist@0.4.9'
  - babel-preset-expo@54.0.11
  - expo-file-system@19.0.23
  - expo-font@14.0.12
  - expo-modules-autolinking@3.0.26
  - expo@54.0.35
